<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2EC4FF" />
      <stop offset="45%" stop-color="#2AABEE" />
      <stop offset="80%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <!-- Subtle Top Glow -->
    <linearGradient id="topGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Shadow -->
    <radialGradient id="innerShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Foreground Shape -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#072A4E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with 115px radius (iOS/Modern app standard) -->
  <rect width="512" height="512" rx="115" fill="url(#brandGradient)" />
  <rect width="512" height="512" rx="115" fill="url(#topGlow)" />
  <rect width="512" height="512" rx="115" fill="url(#innerShine)" />

  <!-- Outer Border Hairline Glow -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" />

  <!-- Main Iconic Foreground: Modern Stylized Speech Arc with Dialogue Wing -->
  <g filter="url(#subtleShadow)">
    <!-- Primary Conversation Bubble forming Arabic 'Meem' / Chat Node -->
    <path
      d="M256 112 C 168 112, 96 178, 96 260 C 96 308, 122 350, 162 377 C 158 398, 146 418, 132 434 C 158 436, 194 425, 222 403 C 233 406, 244 408, 256 408 C 344 408, 416 342, 416 260 C 416 178, 344 112, 256 112 Z"
      fill="#FFFFFF"
    />

    <!-- Secondary Elegant Dialogue Arc Cutout in Brand Blue -->
    <path
      d="M272 176 C 220 176, 178 214, 178 262 C 178 288, 192 312, 215 328 C 213 340, 206 352, 198 360 C 213 361, 234 354, 250 341 C 257 343, 264 344, 272 344 C 324 344, 366 306, 366 262 C 366 218, 324 176, 272 176 Z"
      fill="url(#brandGradient)"
    />

    <!-- Central Glowing Core Light -->
    <circle cx="272" cy="260" r="28" fill="#FFFFFF" />
  </g>
</svg>
